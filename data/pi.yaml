name: "徐敏"
title: "博士 | 教授 | 博士生导师"
social_jobs: "中国认知科学学会社会认知科学分会理事 | 广东认知科学学会理事"
photo: "/images/hero-pi.jpg" 
bio: "徐敏，深圳大学心理学院教授，博士生导师。本科毕业于中山大学心理学系，博士毕业于香港大学语言学系，曾在麻省理工学院和和法兰西公学院（Collège de France）访问学习。多年来致力于研究语言加工、语言发展及其障碍的认知神经机制，尤其关注语言机制中的跨语言共性与汉语特异性。以通讯作者或第一作者（含并列）在Science Advances、Nature Human Behaviour、PNAS、Communications Biology、NeuroImage、Developmental Science、Cerebral Cortex、Brain and Language 等国际高水平期刊发表论文三十多篇。近五年主持多项关于语言加工和语言障碍的科研项目，包括国家自然科学基金面上项目和深圳市优秀青年项目等。"

