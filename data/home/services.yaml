enable: true

title: "研究方向"

cards:
  - image: "images/ResearchInterest_1.png"
    title: "语言脑机制"
    text: "聚焦语言加工的神经基础，运用fMRI、fNIRS、MEG等技术，研究语音、词汇、句法和语义加工的脑表征及功能连接机制，探索语言加工脑机制。"
    

  - image: "images/ResearchInterest_2.png"
    title: "语言发展"
    text: "关注儿童语言能力的发展规律及其神经机制，重点研究学前至学龄阶段词汇、句法和书写能力的发展轨迹，以及工作记忆、家庭环境等因素对语言发展的影响。"


  - image: "images/ResearchInterest_3.png"
    title: "阅读障碍"
    text: "围绕发展性阅读障碍的认知与脑机制开展研究，考察阅读、书写及视听整合等关键能力缺陷，揭示功能脑网络异常特征，为阅读障碍的早期识别与干预提供科学依据。"

