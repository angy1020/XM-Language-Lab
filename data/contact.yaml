join_us:
  - role: "博士后招聘 (Postdoctoral Positions)"
    badge: "长期有效"
    highlight: "合作风格开放包容，注重平等交流，致力于营造积极健康的科研氛围。"
    paragraphs:
      - "长期招收具有**生物医学工程、人工智能、脑机接口**等相关背景的博士后研究人员。"
      - "本人曾受深圳市博士后发展促进会邀请开展中国博士后科学基金申报专题讲座，并多次获得国家、校区及学部级博士后荣誉，**可为合作博士后提供基金申请、科研规划与职业发展方面的经验分享**。"

  - role: "硕博招生 (Graduate Admissions)"
    badge: "2026级起"
    highlight: "没有科班要求，没有学历光环，人格第一，能力本位。"
    paragraphs:
      - "**招生学科方向**：智能科学与技术学术学位点、电子信息（人工智能领域）专业学位点已获批。自 2026 级起，依托上述学位点招收硕博研究生。*（2025级入组学生仍为计算机科学与技术学院学科）*"
      - "**学生背景需求**：本人是跨学科研究背景（控制科学与工程 → 生物医学工程 → 计算机科学与技术）。在符合学校招生政策的前提下，并不排斥跨学科背景学生加入。"
      - "**期望要求**：希望申请人在脑科学实验、算法编程或硬件系统方面具备**至少一项专长或强烈兴趣**，具备较强的主观能动性。特别鼓励对人工智能与神经科学交叉领域有浓浓兴趣、愿主动开拓融合创新思路的优秀学子加入团队。"

  - role: "本科生进组培养 (Undergraduate Training)"
    badge: "欢迎提前入组"
    highlight: "实现早进入、早培养、早结果。"
    paragraphs:
      - "本科生在加入团队前，鼓励先明确个人科研发展规划。"
      - "欢迎有意进入课题组继续深造的本科同学提前入组，参与科研训练与课题探索。"