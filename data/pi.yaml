name: "徐敏"
title: "博士 | 教授 | 博士生导师"
social_jobs: "中国认知科学学会社会认知科学分会理事 | 广东认知科学学会理事"
photo: "/images/hero-pi.jpg" 
bio: "2009年6月于中山大学获心理学学士学位，2014年12月于香港大学语言学系获博士学位，读博期间前往麻省理工学院访问学习。致力于研究语言和语言障碍的认知神经机制，相关研究成果以第一或通讯作者（包括并列）发表在Science Advances、Nature Human Behaviour、PNAS、Communications Biology、Developmental Science、Neuroimage等国际高水平期刊。主持国家自然科学基金面上、青年项目，深圳市优秀青年项目等。入选深圳市海外高层次人才。"

