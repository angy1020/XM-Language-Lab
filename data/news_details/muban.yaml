title: "课题组年度总结暨新春团建活动详情"
date: "2024-02-20"

# 使用列表，把文章分成一段一段的文字与图片组合
sections:
  - type: "text"
    content: "2026年春节前夕，课题组全体成员在致理楼会议室举行了年度学术总结大会。在会上，徐敏老师对大家在过去一年里取得的科研成果给予了高度肯定，并对新一年的实验规划提出了指导意见。"

  - type: "image"
    # 图片放在 assets/images/ 目录下，比如放一张名为 mt1.jpg 的团建大合照
    path: "images/logo.png" 
    caption: "课题组全体成员学术会议大合照"

  - type: "text"
    content: "会后，大家一同前往了轰趴馆进行团建放松。在欢声笑语中，大家开展了趣味桌游比拼、战术密室逃脱等活动，最后在一顿丰盛的新春晚宴中圆满结束了本次团建。"
