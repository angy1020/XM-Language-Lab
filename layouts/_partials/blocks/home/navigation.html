<div style="max-width: 1800px; margin: 0 auto; padding: 0 20px;">
  <hr style="border: 0; height: 1px; background: linear-gradient(to right, rgba(229, 231, 235, 0) 0%, rgba(229, 231, 235, 1) 15%, rgba(229, 231, 235, 1) 85%, rgba(229, 231, 235, 0) 100%);" />
</div>

{{ $data := site.Data.home.navigation }}

<section class="py-12" style="padding-top: 100px;">
  <h1 class="text-primary mb-8 text-center text-3xl font-bold">
    {{ $data.title | default "快速导航" }}
  </h1>
  <div class="container mx-auto px-4" style="max-width: 1500px;">
    
    <div class="grid gap-10 md:grid-cols-2">
      {{ range $data.cards }}
      
      <a href="{{ .link | absURL }}" class="nav-shortcut-card">
        <div class="nav-card-inner">
          
          <div class="nav-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:24px; height:24px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="{{ .icon_path }}" />
            </svg>
          </div>
          
          <div class="nav-text-wrapper">
            <h3 class="nav-card-title">{{ .title }} <span class="arrow">→</span></h3>
            <p class="nav-card-text">{{ .text }}</p>
          </div>
          
        </div>
      </a>
      {{ end }}

    </div>
  </div>
</section>

<style>
  /* 卡片基础白底状态 */
  .nav-shortcut-card {
    display: block;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 32px 24px;
    text-decoration: none !important;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.01);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* 内部横向排版 */
  .nav-card-inner {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  /* 图标清透蓝色底壳 */
  .nav-icon-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 8px;
    background-color: #f0f7ff; 
    color: #09568c; 
    transition: all 0.25s ease;
  }

  /* 标题与正文上下彻底分行 */
  .nav-text-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  /* 卡片大标题 */
  .nav-card-title {
    font-size: 1.35rem;
    font-weight: 700;
    color: #111827;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  /* 隐藏的小箭头 */
  .nav-card-title .arrow {
    font-weight: 500;
    opacity: 0;
    transform: translateX(-5px);
    transition: all 0.25s ease;
  }

  /* 描述正文（两端对齐） */
  .nav-card-text {
    font-size: 0.98rem;
    color: #4b5563;
    line-height: 1.6;
    margin: 0;
    text-align: justify;
  }

  /* ========================================== */
  /* 【交互动效】鼠标悬停悬浮反馈 */
  /* ========================================== */
  .nav-shortcut-card:hover {
    transform: translateY(-6px); /* 1. 立体浮起 */
    border-color: #09568c !important; /* 2. 边框变深 */
    
    /* 3. 产生不发生位移扭曲的 2px 加粗触感 */
    box-shadow: 
      inset 0 0 0 1px #09568c,
      0 20px 25px -5px rgba(0, 0, 0, 0.07), 
      0 10px 10px -5px rgba(0, 0, 0, 0.03) !important;
  }

  /* 4. 图标容器色彩反转（变成深蓝底、白图标） */
  .nav-shortcut-card:hover .nav-icon-wrapper {
    background-color: #09568c !important;
    color: #ffffff !important;
  }

  /* 5. 箭头显现并向右滑出 */
  .nav-shortcut-card:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }
</style>
