# 2. 底部的招聘与招生需求
join_us:
  - role: "博士后招聘 (Postdoctoral Positions)"
    badge: "长期有效"
    highlight: "欢迎具有心理学、语言学、认知神经科学或人工智能交叉背景的优秀博士加入，共同探索语言与大脑的奥秘。"
    paragraphs:
      - "长期招收语言认知神经科学方向博士后，尤其欢迎具有**fMRI、EEG/ERP、MEG、近红外**等神经影像技术经验，或熟悉**计算建模、大语言模型、机器学习**等方法的青年学者。"
      - "课题组研究方向聚焦**语言脑机制、语言发展及阅读障碍**，将为博士后提供独立的科研空间、稳定的项目支持和开放的学术交流环境。"

  - role: "硕博招生 (Graduate Admissions)"
    badge: "2026级起"
    highlight: "面向心理学、语言学、计算机、人工智能、神经科学等交叉背景，欢迎对语言认知与脑机制充满好奇的学生。"
    paragraphs:
      - 希望申请人在**脑科学实验设计、心理语言学、神经影像数据分析、编程与计算建模**等方面具备至少一项专长或强烈兴趣，具备较强的主观能动性和跨学科学习意愿。"

  - role: "本科生进组培养 (Undergraduate Training)"
    badge: "欢迎提前入组"
    highlight: "鼓励本科生早进组、早接触科研，在语言认知神经科学实践中明确发展方向。"
    paragraphs:
      - "欢迎对**语言、大脑与认知**感兴趣的本科同学提前入组，参与文献阅读、实验设计、数据收集与分析等科研训练。"
      - "本科生在加入团队前，建议先明确个人科研发展规划。课题组将根据学生兴趣与特长，提供针对性的指导和成长路径，为未来继续深造或职业发展奠定基础。"